  - "Pangayo ug kumpletoha ang Senior Citizen ID application form kun wala pa kini na-download daan"
  - "Isumite ang naasikaso nga form ug mga gikinahanglan nga dokumento alang sa beripikasyon"
  - "Hulat sa OSCA staff sa pagberipika sa imong pagkakwalipikado ug residency"
  - "Pag-aprobar, dawaa ang imong Senior Citizen ID ug booklet gikan sa OSCA office"
