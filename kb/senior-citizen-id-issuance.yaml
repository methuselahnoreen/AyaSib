summary_ceb: "Ang Senior Citizen ID giisyu sa Office for Senior Citizens Affairs (OSCA) alang sa mga kwalipikadong Pilipino nga nag-edad og 60 anyos pataas. Nagserbisyo kini isip proba sa pagkakwalipikado alang sa mga benepisyo, diskwento, ug mga privilege ubos sa Expanded Senior Citizens Act."
